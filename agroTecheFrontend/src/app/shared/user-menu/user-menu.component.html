@if (auth.currentUser(); as profile) {
  <div class="flex items-center gap-3">
    <span class="hidden sm:block text-sm text-gray-600">{{ profile.name }}</span>
    <span class="hidden md:block px-2.5 py-1 text-xs font-medium rounded-full"
      [class]="profile.role === 'ADMIN' ? 'bg-purple-100 text-purple-700' :
               profile.role === 'TECHNICIEN' ? 'bg-blue-100 text-blue-700' :
               'bg-green-100 text-green-700'">
      {{ roleLabels[profile.role] }}
    </span>
    <button (click)="logout()"
      class="flex items-center gap-1.5 text-sm text-gray-400 hover:text-red-500 transition px-2 py-1.5 rounded-lg hover:bg-red-50">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
          d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/>
      </svg>
      <span class="hidden sm:block">Déconnexion</span>
    </button>
  </div>
}
